[package]
name = "bukio-cli"
version = "0.8.0"
edition = "2021"
description = "Agent-first, local-first double-entry bookkeeping for Dutch SMEs"
license = "Apache-2.0"
repository = "https://github.com/erikvankempen/bukio-cli"
authors = ["Bartholomeus van Eynthoven <bartholomeus@bartholomeus.work>"]

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.5", features = ["derive"] }
regex = "1.13.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rust_xlsxwriter = "0.97.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
ureq = "3.3.0"

[profile.release]
lto = true
strip = true

[dev-dependencies]
tempfile = "3.27.0"
